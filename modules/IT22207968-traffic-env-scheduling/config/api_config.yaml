# API Configuration
# IT22207968 - Traffic & Environmental Scheduling Module
# IMPORTANT: Never commit real API keys. Use environment variables.

openweather:
  base_url: "https://api.openweathermap.org/data/2.5"
  api_key_env: "OPENWEATHER_API_KEY"        # Export this env variable
  forecast_hours: 48                         # Hours ahead to forecast
  units: "metric"                            # Celsius, m/s
  location:
    city: "Colombo"
    country: "LK"
    lat: 6.9271
    lon: 79.8612

google_maps:
  base_url: "https://maps.googleapis.com/maps/api"
  api_key_env: "GOOGLE_MAPS_API_KEY"
  traffic_model: "best_guess"               # or "pessimistic"/"optimistic"
  departure_time: "now"

tomtom:
  base_url: "https://api.tomtom.com/traffic/services"
  api_key_env: "TOMTOM_API_KEY"
  version: 4
  style: "relative0"                         # Relative to free-flow speed
  zoom: 14
  format: "json"

scheduling:
  planning_horizon_days: 7                  # Look-ahead window for scheduling
  min_dry_weather_hours: 6                  # Minimum consecutive dry hours for repair
  max_acceptable_rainfall_mm: 2.0           # Rainfall threshold (mm/hr)
  max_acceptable_temp_c: 35.0              # Upper temperature limit for asphalt
  min_acceptable_temp_c: 10.0             # Lower temperature limit
  peak_traffic_hours:                       # Avoid scheduling during these
    morning: [7, 9]                         # 07:00-09:00
    evening: [16, 19]                       # 16:00-19:00
  preferred_repair_hours: [9, 16]          # 09:00-16:00

output:
  report_format: "json"                     # or "html" / "pdf"
  report_output_dir: "outputs/schedules"
  dashboard_endpoint: "https://road-inspector-gis.firebase.io/schedules"
