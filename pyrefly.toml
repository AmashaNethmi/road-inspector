# Pyrefly Configuration for Road Inspector Project
# Maps Python virtual environment and suppresses unresolved imports

site-package-path = [
    "RepairAreaSegmentation/backend/.venv/Lib/site-packages"
]

search-path = [
    ".",
    "RepairAreaSegmentation/backend"
]

python-interpreter-path = "RepairAreaSegmentation/backend/.venv/Scripts/python.exe"

ignore-missing-imports = [
    "torch",
    "torch.*",
    "torchvision",
    "torchvision.*",
    "cv2",
    "cv2.*",
    "numpy",
    "numpy.*",
    "ultralytics",
    "ultralytics.*",
    "scipy",
    "scipy.*",
    "sklearn",
    "sklearn.*"
]

[errors]
missing-import = "ignore"
untyped-import = "ignore"
bad-argument-type = "ignore"
